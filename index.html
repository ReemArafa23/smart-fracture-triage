<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فرز الكسور الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=swap" rel="stylesheet">
<style>
/* فكرة التصميم: "غرفة قراءة الأشعة"
   - الأشعة دايماً على "فيلم" كحلي منوّر (Lightbox)، وده العنصر المميز الوحيد في الصفحة
   - باقي الواجهة هادية: أبيض/كحلي، وألوان الفرز التلاتة للمعنى بس
   - حركة واحدة مرتبة: المسح على الأشعة في البانر + ظهور الحالات أول مرة
   الخط: Readex Pro (عربي وإنجليزي) */

/* ===== الألوان (فاتح/غامق بزرار، مش حسب الجهاز) ===== */
:root{color-scheme:light;
  --bg:#edf2f7; --surface:#ffffff; --sunk:#f3f6fa; --line:#d8e1eb; --ink:#0e1a2b; --mute:#5a6b80;
  --accent:#1679a3; --glow:#6fd0f2; --film:#0b1626; --film2:#13243b;
  --red:#e5484d; --amb:#e8990f; --grn:#2ba36b; --ind:#5b6cf0;
  --shadow:0 1px 2px rgb(14 26 43/.05),0 6px 20px -8px rgb(14 26 43/.14);
  --r-lg:20px; --r:14px; --r-sm:10px}
:root[data-theme=dark]{color-scheme:dark;
  --bg:#08111e; --surface:#0f1b2c; --sunk:#142337; --line:#22344c; --ink:#e4ecf5; --mute:#8ea0b6;
  --accent:#5cc3ea; --film:#050b14; --film2:#0d1a2c; --shadow:none}
.red-c{--c:var(--red)}.amb-c{--c:var(--amb)}.grn-c{--c:var(--grn)}
*{box-sizing:border-box;min-width:0}
html.theming,html.theming *{transition:background-color .45s ease,color .45s ease,border-color .45s ease,fill .45s ease!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
[hidden]{display:none!important}
a{color:var(--accent)}

/* ===== الشريط العلوي ===== */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px max(4vw,16px);
  background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;margin-inline-end:auto;text-decoration:none;color:inherit}
.logo{width:44px;height:44px;border-radius:12px;background:var(--film);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgb(111 208 242/.25),0 0 18px -4px rgb(111 208 242/.45)}
.brand h1{font-size:19px;line-height:1.2;margin:0;font-weight:600;letter-spacing:-.01em}
.brand small{display:block;color:var(--mute);font-size:12.5px;line-height:1.3}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;font-size:12.5px;color:var(--mute);background:var(--sunk)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--amb);flex:none}
.pill.ok .dot{background:var(--grn)}.pill.err .dot{background:var(--red)}
.pill:not(.ok):not(.err) .dot{animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.btn{text-decoration:none;min-height:44px;padding:0 18px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-weight:500;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:background .15s,transform .15s,box-shadow .15s}
.btn:hover{background:var(--sunk)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
:root[data-theme=dark] .btn.primary{color:#05111d}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 86%,#000);box-shadow:0 8px 18px -10px var(--accent)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--sunk)}
.iconbtn{width:40px;height:40px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);transition:background .15s}
.iconbtn:hover{background:var(--sunk)}
.iconbtn svg{width:20px;height:20px}
#themeBtn .sun,#themeBtn .moon{animation:spin-in .45s cubic-bezier(.2,.8,.3,1.3)}
:root:not([data-theme=dark]) #themeBtn .sun{display:none}
:root[data-theme=dark] #themeBtn .moon{display:none}
@keyframes spin-in{from{transform:rotate(-90deg) scale(.4);opacity:0}}

/* ===== التخطيط ===== */
main{max-width:1260px;margin:0 auto;padding:26px max(4vw,16px) 40px}
.panel{background:var(--surface);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
h2{font-size:17px;margin:0 0 12px;font-weight:600}
label{font-size:14px;color:var(--mute);display:block;margin-bottom:4px}
input,select,textarea{width:100%;min-height:44px;font-size:16px;padding:8px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--sunk);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
textarea{min-height:96px;resize:vertical}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .wide{grid-column:1/-1}
.note{font-size:13px;color:var(--mute);margin:10px 0 0}

/* ===== البانر: نص + لوح أشعة متحرك ===== */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(20px,4vw,56px);align-items:center;margin:6px 0 34px}
.hero h2{font-size:clamp(30px,4.2vw,50px);line-height:1.18;font-weight:600;margin:0 0 14px;letter-spacing:-.02em;text-wrap:balance}
.hero p{font-size:clamp(16px,1.4vw,18px);color:var(--mute);margin:0 0 24px;max-width:46ch}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.facts{display:flex;gap:clamp(18px,3vw,40px);margin:30px 0 0;padding:18px 0 0;border-top:1px solid var(--line);flex-wrap:wrap}
.facts div{display:flex;flex-direction:column-reverse}
.facts dd{margin:0;font-size:26px;font-weight:600;line-height:1.15}
.facts dt{font-size:13px;color:var(--mute)}
@media(max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}.lightbox{max-width:420px;justify-self:center;width:100%}}

.lightbox{position:relative;margin:0;aspect-ratio:300/360;border-radius:24px;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 30%,var(--film2),var(--film) 70%);
  box-shadow:0 30px 60px -30px rgb(5 11 20/.7),inset 0 0 0 1px rgb(111 208 242/.18)}
.lightbox::before{content:"";position:absolute;inset:0;background:
  linear-gradient(rgb(111 208 242/.05) 1px,transparent 1px) 0 0/100% 24px,
  linear-gradient(90deg,rgb(111 208 242/.05) 1px,transparent 1px) 0 0/24px 100%;pointer-events:none}
.lightbox svg{position:absolute;inset:0;width:100%;height:100%}
.lb-mark{position:absolute;top:14px;inset-inline-start:16px;font:500 12px/1 "Readex Pro",sans-serif;color:rgb(111 208 242/.75);letter-spacing:.04em;direction:ltr}
.scanline{position:absolute;inset-inline:0;top:0;height:22%;pointer-events:none;
  background:linear-gradient(to bottom,transparent,rgb(111 208 242/.10) 70%,rgb(111 208 242/.55) 98%,transparent);
  animation:scan 7s cubic-bezier(.45,.05,.55,.95) infinite}
@keyframes scan{0%{transform:translateY(-100%);opacity:1}34%{transform:translateY(460%);opacity:1}38%,100%{transform:translateY(460%);opacity:0}}
.lb-box{fill:none;stroke:#ff5a5f;stroke-width:2.4;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 7s ease infinite}
@keyframes draw{0%,34%{stroke-dashoffset:1;opacity:1}43%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
.lb-conf{animation:pop-in 7s ease infinite}
@keyframes pop-in{0%,41%{opacity:0;transform:translateY(4px)}46%,90%{opacity:1;transform:none}97%,100%{opacity:0}}
.lb-status{position:absolute;inset-inline:14px;bottom:14px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;
  background:rgb(5 11 20/.72);backdrop-filter:blur(6px);min-height:46px;border:1px solid rgb(111 208 242/.18);color:#e4ecf5;font-size:14px}
.lb-status .st{display:flex;align-items:center;gap:8px;position:absolute;inset-inline-start:14px;transition:none}
.lb-status .st1{animation:st1 7s ease infinite}.lb-status .st2{animation:st2 7s ease infinite;color:#ff8f92;font-weight:600}
.lb-status .pct{margin-inline-start:auto;font-size:20px;font-weight:600;color:#ff8f92;animation:st2 7s ease infinite}
.lb-status .spacer{visibility:hidden}
@keyframes st1{0%,40%{opacity:1}44%,96%{opacity:0}100%{opacity:1}}
@keyframes st2{0%,42%{opacity:0}47%,92%{opacity:1}97%,100%{opacity:0}}
.lb-status i{width:8px;height:8px;border-radius:50%;background:var(--glow);flex:none}
.lb-status .st2 i{background:#ff5a5f;box-shadow:0 0 0 4px rgb(255 90 95/.2)}
@media(prefers-reduced-motion:reduce){
  .scanline{display:none}.lb-box{animation:none;stroke-dashoffset:0}.lb-conf{animation:none}
  .lb-status .st1{display:none}.lb-status .st2,.lb-status .pct{animation:none;opacity:1}}

/* ===== القائمة: عمود جانبي (رفع + مساعد) + قائمة الطبيب ===== */
.grid{display:grid;grid-template-columns:minmax(0,350px) minmax(0,1fr);gap:24px;align-items:start}
.side{align-self:stretch;display:flex;flex-direction:column;gap:18px}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.uptitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.uptitle h2{margin:0}

/* منطقة الرفع = لوح أشعة فاضي */
.drop{position:relative;overflow:hidden;display:grid;place-items:center;text-align:center;gap:4px;padding:30px 16px 26px;border-radius:var(--r);cursor:pointer;color:#dbe8f5;
  background:radial-gradient(110% 90% at 50% 20%,var(--film2),var(--film) 75%);border:1.5px dashed rgb(111 208 242/.38);transition:border-color .2s,box-shadow .2s}
.drop::before{content:"";position:absolute;inset:0;background:linear-gradient(rgb(111 208 242/.05) 1px,transparent 1px) 0 0/100% 20px;pointer-events:none}
.drop:hover,.drop.over{border-color:var(--glow);box-shadow:0 0 0 4px rgb(111 208 242/.14),inset 0 0 40px -10px rgb(111 208 242/.35)}
.drop svg{color:var(--glow);margin-bottom:6px;transition:transform .25s}
.drop:hover svg{transform:translateY(-3px)}
.drop b{font-size:16px;font-weight:500}.drop span{color:#8ea0b6;font-size:13.5px}
details{margin-top:14px}summary{cursor:pointer;font-weight:500;min-height:32px;color:var(--accent)}
.privacy{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mute);margin:14px 0 0;line-height:1.55}
.privacy svg{flex:none;color:var(--grn);margin-top:2px}

/* شريط الفرز (بدل 4 كروت عدادات) */
.listhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.listhead h2{margin:0;margin-inline-end:auto;font-size:19px}
.triage{margin-bottom:18px}
.tbar{display:flex;gap:3px;height:12px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.tbar span{flex-grow:var(--n);flex-basis:0;background:var(--c);transition:flex-grow .6s cubic-bezier(.2,.8,.2,1)}
.tleg{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:10px;font-size:14px;color:var(--mute)}
.tleg span{display:inline-flex;align-items:center;gap:7px}
.tleg b{color:var(--ink);font-weight:600;font-size:16px}
.tleg i{width:9px;height:9px;border-radius:3px;background:var(--c)}

/* كارت الحالة */
.case{--c:var(--line);display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px;margin-bottom:12px;
  background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);position:relative}
.case::before{content:"";position:absolute;inset-block:14px;inset-inline-start:0;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
[dir=rtl] .case::before{border-radius:4px 0 0 4px}
.case.new{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.case.red{--c:var(--red)}.case.yellow{--c:var(--amb)}.case.green{--c:var(--grn)}.case.done{opacity:.72}
.film{position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;background:var(--film);box-shadow:inset 0 0 0 1px rgb(111 208 242/.15)}
.thumb{width:100%;height:100%;object-fit:contain;display:block}
.film .scan{position:absolute;inset-inline:0;top:0;height:40%;background:linear-gradient(to bottom,transparent,rgb(111 208 242/.6));animation:fscan 1.2s ease-in-out infinite alternate}
@keyframes fscan{from{transform:translateY(-100%)}to{transform:translateY(160%)}}
.case h3{margin:0;font-size:16px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:12.5px;font-weight:500;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 85%,var(--ink))}
.meta{font-size:13.5px;color:var(--mute)}
.late{color:var(--red);font-weight:600}
.sum{font-size:13.5px;margin-top:8px;padding:8px 12px;border-radius:var(--r-sm);background:var(--sunk);color:var(--ink)}
.sum.wait{color:var(--mute)}
.case .end{display:flex;flex-direction:column;align-items:stretch;gap:6px;min-width:128px}
.case .big{font-size:30px;font-weight:600;line-height:1;color:var(--c);text-align:center;margin-bottom:6px}
.case.done .big{color:var(--mute)}
@media(max-width:640px){.case{grid-template-columns:64px minmax(0,1fr)}.film{width:64px;height:64px}
  .case .end{grid-column:1/-1;flex-direction:row;align-items:center}.case .big{margin:0 auto 0 0;font-size:24px}[dir=rtl] .case .big{margin:0 0 0 auto}}
.empty{text-align:center;padding:44px 16px;color:var(--mute);border:1.5px dashed var(--line);border-radius:var(--r-lg)}
.empty svg{color:var(--accent);opacity:.8;margin-bottom:8px}

/* ===== صفحة الحالة ===== */
.back{margin-bottom:12px}
.casehead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.casehead h2{font-size:26px;margin:0;margin-inline-end:auto}
.casegrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:900px){.casegrid{grid-template-columns:minmax(0,1fr)}}
.viewer{background:radial-gradient(120% 80% at 50% 20%,var(--film2),var(--film) 70%);border-radius:var(--r-lg);padding:14px;color:#e4ecf5;
  box-shadow:0 30px 60px -30px rgb(5 11 20/.7),inset 0 0 0 1px rgb(111 208 242/.15);position:sticky;top:80px}
@media(max-width:900px){.viewer{position:static}}
.stage{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#000}
.stage img,.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage canvas{mix-blend-mode:screen;transition:opacity .2s;animation:fade .8s ease both .2s}
@keyframes fade{from{opacity:0}}
.stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stage svg rect{fill:none;stroke:#ff4d52;stroke-width:3;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:lock .55s cubic-bezier(.2,.8,.2,1.2) both .4s}
@keyframes lock{from{opacity:0;transform:scale(1.6)}}
.stage svg text{fill:#fff;font:600 13px "Readex Pro",sans-serif;paint-order:stroke;stroke:#ff4d52;stroke-width:4px;animation:fade .3s ease both 1s}
@media(prefers-reduced-motion:reduce){.stage svg rect,.stage svg text,.stage canvas,.case.new,.film .scan{animation:none}}
.toggle{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer}
.toggle input{width:20px;height:20px;min-height:0;accent-color:#ff4d52}
.yolo{font-size:13.5px;margin-top:3px}
.vbar{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap;font-size:14px}
.vbar input[type=range]{flex:1;min-height:auto;padding:0;accent-color:var(--glow);border:0;background:none;box-shadow:none}
.legend{display:flex;align-items:center;gap:8px;font-size:13px;color:#8ea0b6;margin-top:6px}
.legend i{flex:1;height:7px;border-radius:4px;background:linear-gradient(90deg,#00f,#0ff,#0f0,#ff0,#f00)}
[dir=rtl] .legend i{background:linear-gradient(-90deg,#00f,#0ff,#0f0,#ff0,#f00)}
.viewer .note{color:#8ea0b6}
.result{position:relative;overflow:hidden}
.result .prob{font-size:56px;font-weight:600;line-height:1;color:var(--c);letter-spacing:-.02em}
.bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;border-radius:5px;background:var(--c);transform-origin:right;animation:grow .9s cubic-bezier(.2,.8,.2,1) both .2s}
[dir=ltr] .bar i{transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:15px}
.kv dt{color:var(--mute)}.kv dd{margin:0}
.stack>*+*{margin-top:16px}
.decisions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
@media(max-width:520px){.decisions{grid-template-columns:1fr}}
.decisions .btn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.warn{border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--ink);border-inline-start:4px solid var(--red);font-size:15px}

/* ===== نوافذ + تنبيه + فوتر ===== */
.modal{position:fixed;inset:0;background:rgb(5 11 20/.55);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:60}
.modal .panel{width:min(560px,100%);animation:rise .25s ease both}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;bottom:22px;inset-inline-start:50%;translate:-50% 0;background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:12px;z-index:70;font-size:15px;animation:rise .25s ease both}
[dir=rtl] .toast{translate:50% 0}
footer{max-width:1260px;margin:0 auto;padding:18px max(4vw,16px) 96px;color:var(--mute);font-size:13px;border-top:1px solid var(--line)}

/* ===== المساعد الذكي ===== */
.fab{position:fixed;bottom:22px;inset-inline-end:22px;z-index:40;width:60px;height:60px;border-radius:18px;border:0;background:var(--film);color:var(--glow);
  display:grid;place-items:center;box-shadow:0 14px 30px -10px rgb(5 11 20/.6),inset 0 0 0 1px rgb(111 208 242/.3);transition:transform .2s}
.fab:hover{transform:translateY(-2px)}
.chat{display:flex;flex-direction:column;background:var(--surface);overflow:hidden;border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.chat:not(.docked){position:fixed;bottom:94px;inset-inline-end:22px;z-index:41;width:min(390px,calc(100vw - 28px));height:min(580px,calc(100vh - 130px));
  border-radius:22px;box-shadow:0 30px 70px -20px rgb(5 11 20/.5);animation:rise .22s ease both}
@media(max-width:520px){.chat:not(.docked){inset-inline:10px;bottom:90px;width:auto;height:calc(100vh - 120px)}}
.chat.docked{position:sticky;top:84px;border-radius:var(--r-lg);box-shadow:var(--shadow);height:min(560px,calc(100vh - 110px));min-height:420px}
.chathead{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.chathead .av{width:38px;height:38px;border-radius:12px;background:var(--film);color:var(--glow);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgb(111 208 242/.25)}
.chathead b{display:block;font-size:15.5px;line-height:1.25;font-weight:600}.chathead small{font-size:12.5px;color:var(--mute)}
.chathead .x{margin-inline-start:auto;width:34px;height:34px;border:0;border-radius:10px;background:var(--sunk);font-size:18px}
.chat.docked .x{display:none}
.demo-note{font-size:12px;padding:6px 14px;background:color-mix(in srgb,var(--amb) 14%,transparent);text-align:center}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.65;overflow-wrap:anywhere;animation:rise .25s ease both}
.msg.bot{align-self:flex-start;background:var(--sunk);border-end-start-radius:5px}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-end-end-radius:5px}
:root[data-theme=dark] .msg.user{color:#05111d}
.msg.typing{display:inline-flex;gap:4px;align-items:center}
.msg.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:bounce 1s infinite}
.msg.typing i:nth-child(2){animation-delay:.15s}.msg.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{50%{transform:translateY(-4px);opacity:.4}}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 12px;font-size:13px;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.chatin{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.chatin input{min-height:44px;border-radius:12px}
.chatin button{width:46px;flex:none;border:0;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center}
:root[data-theme=dark] .chatin button{color:#05111d}
.chatin button:disabled{opacity:.5}
.chatfoot{font-size:11.5px;color:var(--mute);text-align:center;padding:0 12px 10px}
</style>
</head>

const KEY = "fracture-triage-v1";
let S = { cases: [], next: 1, hook: "", chatUrl: "", lang: "ar", theme: "light" };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
// نحفظ بعد أي تغيير (لو المساحة خلصت ما نوقف الصفحة)
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast("⚠️ storage full"); } };
const L = () => T[S.lang];                                   // نصوص اللغة الحالية
const $ = s => document.querySelector(s);
// أي نص جاي من المستخدم أو الـ Webhook بنعمله escape علشان ما يتنفذش كـ HTML
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

// الوقت بصيغة ISO مع فرق التوقيت المحلي (زي 2026-11-28T16:05:00+03:00)
function isoLocal(d = new Date()) {
  const z = -d.getTimezoneOffset(), p = n => String(Math.floor(Math.abs(n))).padStart(2, "0");
  const t = new Date(d.getTime() + z * 60000).toISOString().slice(0, 19);
  return `${t}${z >= 0 ? "+" : "-"}${p(z / 60)}:${p(z % 60)}`;
}
// عرض الساعة (بالأرقام العربية في الواجهة العربية)
const hhmm = iso => iso ? new Date(iso).toLocaleTimeString(S.lang === "ar" ? "ar-EG" : "en-GB", { hour: "2-digit", minute: "2-digit" }) : "";
const nf = n => n.toLocaleString(S.lang === "ar" ? "ar-EG" : "en");
// النسبة المئوية (بنوقف عند 99% لأن النموذج عمره ما بيبقى متأكد 100%)
const pct = p => { const v = Math.min(99, Math.round(p * 100)); return S.lang === "ar" ? `${nf(v)}٪` : `${v}%`; };
const minsBetween = (a, b) => Math.max(0, Math.round((new Date(b) - new Date(a)) / 60000));

// =====================================================================
// 3) تحميل النموذج والإعدادات
// =====================================================================
const FEAT = "StatefulPartitionedCall/functional_2_1/densenet121_1/relu_1/Relu";          // خريطة المميزات (12×12×1024)
const DENSE = "StatefulPartitionedCall/functional_2_1/fracture_prob_1/Cast/ReadVariableOp"; // أوزان الطبقة الأخيرة (1024)
let model = null, CFG = null, denseW = null;

async function loadModel() {
  setPill("", L().loading);
  try {
    CFG = await (await fetch("config.json")).json();          // الحدود: threshold و red و yellow
    model = await tf.loadGraphModel("model/model.json");       // النموذج نفسه (TensorFlow.js)
    denseW = model.weights[DENSE][0].reshape([1024]);          // أوزان الطبقة الأخيرة لحساب Grad-CAM
    tf.tidy(() => model.execute(tf.zeros([1, 384, 384, 3]), [FEAT, "Identity"]));  // تسخين أول مرة
    setPill("ok", L().ready);
    $("#mAuc").textContent = CFG.test_metrics.AUC.toFixed(3);
    $("#mRec").textContent = (CFG.test_metrics.Recall * 100).toFixed(1) + "%";
    $("#modelInfo").textContent = `${CFG.model} · ${CFG.dataset} · AUC ${CFG.test_metrics.AUC.toFixed(3)} · Recall ${(CFG.test_metrics.Recall*100).toFixed(1)}%`;
  } catch (e) { console.error(e); setPill("err", L().failed); }
}
function setPill(cls, txt, pill = "#modelPill", text = "#modelText") { $(pill).className = "pill " + cls; $(text).textContent = txt; }

// =====================================================================
// 4) تجهيز الصورة بنفس طريقة النوتبوك بالظبط
//    رمادي ← توزيع الدرجات (0.5%–99.5%) ← تصغير مع الحفاظ على النسبة ← في نص مربع أسود 384×384
// =====================================================================
function readImage(file) {
  return new Promise((ok, bad) => {
    const img = new Image(); img.onload = () => ok(img); img.onerror = bad;
    img.src = URL.createObjectURL(file);
  });
}
function prepare(img, N = 384, pad = 0) {
  const r = N / Math.max(img.width, img.height);
  const w = Math.round(img.width * r), h = Math.round(img.height * r), x0 = (N - w) >> 1, y0 = (N - h) >> 1;
  const c = document.createElement("canvas"); c.width = c.height = N;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.fillStyle = `rgb(${pad},${pad},${pad})`; g.fillRect(0, 0, N, N);   // الحواف: أسود للتصنيف، رمادي 114 لـ YOLO
  g.imageSmoothingQuality = "high"; g.drawImage(img, x0, y0, w, h);
  const d = g.getImageData(x0, y0, w, h), px = d.data, gray = new Float32Array(w * h);
  for (let i = 0; i < gray.length; i++) gray[i] = (px[i*4] + px[i*4+1] + px[i*4+2]) / 3;   // رمادي = متوسط القنوات
  const sorted = Float32Array.from(gray).sort();
  const lo = sorted[Math.floor(sorted.length * 0.005)], hi = sorted[Math.floor(sorted.length * 0.995)];
  for (let i = 0; i < gray.length; i++) {
    const v = Math.max(0, Math.min(255, (gray[i] - lo) / (hi - lo + 1e-6) * 255));
    px[i*4] = px[i*4+1] = px[i*4+2] = v; px[i*4+3] = 255;
  }
  g.putImageData(d, x0, y0);
  c.geo = { x0, y0, w, h };   // مكان الصورة جوه المربع (علشان نرجّع إحداثيات المربعات)
  return c;   // كانفس N×N جاهز للنموذج
}

// =====================================================================
// 5) التوقع + Grad-CAM
//    TTA: بنتوقع على الصورة ونسختها المقلوبة وناخد المتوسط
//    Grad-CAM: مع طبقة GlobalAveragePooling بيساوي مجموع (المميزات × أوزان الطبقة الأخيرة)
// =====================================================================
function predict(canvas) {
  return tf.tidy(() => {
    const x = tf.browser.fromPixels(canvas).toFloat().expandDims(0);     // [1,384,384,3] أرقام 0..255
    const both = tf.concat([x, tf.reverse(x, 2)], 0);                    // الأصلية + المقلوبة
    const [feat, prob] = model.execute(both, [FEAT, "Identity"]);
    const p = prob.mean().dataSync()[0];                                 // متوسط الاحتمالين
    let cam = tf.relu(feat.slice([0,0,0,0],[1,-1,-1,-1]).squeeze().mul(denseW).sum(-1)); // 12×12
    cam = cam.div(cam.max().add(1e-8));
    return { p, cam: Array.from(cam.dataSync(), v => +v.toFixed(3)) };
  });
}
// تصنيف اللون حسب الحدود اللي اتحددت من الـ Validation
const levelOf = p => p >= CFG.levels.red ? "red" : p >= CFG.levels.yellow ? "yellow" : "green";

// =====================================================================
// 5ب) YOLO: تحديد مكان الكسر بمربع
//     المدخل: صورة 640×640 (رمادي، حواف 114، أرقام 0..1) ← المخرج: 8400 مربع مقترح [x,y,w,h,ثقة]
//     بنشيل الضعيف (أقل من 25%) ونشيل المتكرر (NMS)
// =====================================================================
let yolo = null; const pendingYolo = new Map();     // صور مستنية YOLO يخلص تحميل
async function loadYolo() {
  setPill("", L().yLoading, "#yoloPill", "#yoloText");
  try {
    // ملف YOLO متقسم 4 أجزاء (علشان GitHub مابيقبلش ملف أكبر من 25MB من المتصفح) ← بنجمعهم تاني
    const parts = await Promise.all([1, 2, 3, 4].map(i => `yolo/best.onnx.part${i}`).map(async u => new Uint8Array(await (await fetch(u)).arrayBuffer())));
    const bytes = new Uint8Array(parts.reduce((n, p) => n + p.length, 0)); let off = 0;
    for (const p of parts) { bytes.set(p, off); off += p.length; }
    yolo = await ort.InferenceSession.create(bytes, { executionProviders: ["wasm"] });
    setPill("ok", L().yReady, "#yoloPill", "#yoloText");
    for (const [id, cv] of pendingYolo) { const c = byId(id); if (c) await runYolo(c, cv); }   // الحالات اللي وصلت قبل ما يجهز
    pendingYolo.clear();
  } catch (e) { console.error(e); setPill("err", L().yFailed, "#yoloPill", "#yoloText"); }
}
async function detect(canvas) {
  const N = 640, px = canvas.getContext("2d").getImageData(0, 0, N, N).data, x = new Float32Array(3 * N * N);
  for (let i = 0; i < N * N; i++) x[i] = x[i + N*N] = x[i + 2*N*N] = px[i * 4] / 255;   // نفس القيمة في القنوات التلاتة (رمادي)
  const out = (await yolo.run({ images: new ort.Tensor("float32", x, [1, 3, N, N]) })).output0.data;
  const K = 8400, cand = [];
  for (let i = 0; i < K; i++) {
    const sc = out[4 * K + i]; if (sc < 0.25) continue;                 // ثقة أقل من 25% ← نتجاهله
    const cx = out[i], cy = out[K + i], w = out[2 * K + i], h = out[3 * K + i];
    cand.push([cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2, sc]);
  }
  cand.sort((a, b) => b[4] - a[4]);
  const iou = (a, b) => { const iw = Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])), ih = Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
    const I = iw * ih; return I / ((a[2]-a[0])*(a[3]-a[1]) + (b[2]-b[0])*(b[3]-b[1]) - I); };
  const keep = []; for (const b of cand) if (keep.every(k => iou(k, b) < 0.45)) keep.push(b);   // NMS
  // نحوّل الإحداثيات لنسبة من الصورة الأصلية (0..1) علشان نرسمها على أي حجم
  const { x0, y0, w, h } = canvas.geo, cl = v => Math.max(0, Math.min(1, v));
  return keep.slice(0, 5).map(b => [cl((b[0]-x0)/w), cl((b[1]-y0)/h), cl((b[2]-x0)/w), cl((b[3]-y0)/h), +b[4].toFixed(3)].map(v => +v.toFixed(4)));
}
async function runYolo(c, cv) {
  try { c.boxes = await detect(cv); } catch (e) { console.error(e); c.boxes = []; }
  save(); render();
}

const drop = $("#drop"), fileInput = $("#file");
drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); } });
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => handleFiles([...e.dataTransfer.files]));
fileInput.addEventListener("change", () => { handleFiles([...fileInput.files]); fileInput.value = ""; });   // نسخة من الليستة قبل ما نفضّي الخانة

async function handleFiles(files) {
  if (!model) { toast(L().loading); return; }
  for (const f of files) {
    if (!f.type.startsWith("image/")) { toast(L().notImage); continue; }
    const img = await readImage(f), canvas = prepare(img), cv640 = prepare(img, 640, 114);
    const { p, cam } = predict(canvas);
    const c = {
      id: S.next++, file: f.name, p: +p.toFixed(4), level: levelOf(p),
      result: p >= CFG.threshold ? "fracture" : "normal",
      arrivedAt: isoLocal(), reviewedAt: null, sentAt: null, summary: null, summaryDemo: false, sendState: "pending",
      age: $("#fAge").value || "", sex: $("#fSex").value, region: $("#fRegion").value, cause: $("#fCause").value.trim(),
      img: canvas.toDataURL("image/jpeg", 0.82), cam, ar: +(img.width / img.height).toFixed(4), boxes: null,
      notes: "", decision: null, decidedAt: null
    };
    URL.revokeObjectURL(img.src);
    S.cases.push(c); save(); render();
    if (yolo) await runYolo(c, cv640); else pendingYolo.set(c.id, cv640);   // YOLO: مكان الكسر
    sendCase(c);                                   // نبعت النتيجة لـ n8n
  }
}

// =====================================================================
// 7) الإرسال للـ Webhook (n8n) واستقبال الملخص
// =====================================================================
async function post(body) {
  const r = await fetch(S.hook, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(r.status);
  const txt = await r.text();
  try { const j = JSON.parse(txt); const o = Array.isArray(j) ? j[0] : j; return o?.summary ?? o?.output ?? o?.text ?? ""; }
  catch { return txt; }                            // لو الرد نص عادي
}
// شكل البيانات المتفق عليه: case_id, result, confidence, level, uploaded_at (+ البيانات الأساسية)
const payload = c => ({ event: "new_case", case_id: c.id, result: c.result, confidence: c.p, level: c.level,
  uploaded_at: c.arrivedAt, age: c.age ? +c.age : null, sex: c.sex || null, region: c.region || null,
  injury_cause: c.cause || null, file_name: c.file, model: CFG.model, lang: S.lang,
  yolo_boxes: c.boxes ? c.boxes.length : null, yolo_max_conf: c.boxes && c.boxes.length ? c.boxes[0][4] : null });

async function sendCase(c) {
  if (!S.hook) {                                   // وضع تجريبي: ملخص محلي لين يتجهز رابط n8n
    c.sendState = "demo"; c.summary = L().demo(c, L()); c.summaryDemo = true; save(); render(); return;
  }
  c.sendState = "sending"; render();
  try { c.summary = (await post(payload(c))) || null; c.summaryDemo = false; c.sentAt = isoLocal(); c.sendState = "ok"; }
  catch (e) { console.warn(e); c.sendState = "fail"; }
  save(); render();
}
// أحداث تانية بتنرسل: المراجعة وقرار الطبيب (علشان تنحفظ في الشيت)
async function sendEvent(body) { if (!S.hook) return; try { await post(body); } catch (e) { toast(L().hookBad); } }

const RANK = { red: 0, yellow: 1, green: 2 };
const seen = new Set();   // الحالات اللي اترسمت قبل كده (الحركة بتحصل أول مرة بس)
function sorted() {
  // اللي لسه ما اتراجعش فوق ← حسب اللون ← الأعلى اشتباهًا ← الأقدم وصولًا
  return [...S.cases].sort((a, b) => (!!a.reviewedAt - !!b.reviewedAt) || (RANK[a.level] - RANK[b.level]) || (b.p - a.p) || (a.id - b.id));
}
function render() {
  const l = L(), open = S.cases.filter(c => !c.reviewedAt);
  const cnt = k => open.filter(c => c.level === k).length;
  // شريط الفرز: كل لون عرضه على قد عدد حالاته (بدل 4 كروت عدادات)
  const seg = [["red", "red", cnt("red"), l.red], ["amb", "yellow", cnt("yellow"), l.yellow], ["grn", "green", cnt("green"), l.green]];
  const done = S.cases.length - open.length;
  $("#stats").innerHTML = `<div class="tbar">${seg.map(([k, , n]) => `<span class="${k}-c" style="--n:${n}"></span>`).join("")}</div>
    <div class="tleg">${seg.map(([k, , n, t]) => `<span class="${k}-c"><i></i><b class="num">${nf(n)}</b>${t}</span>`).join("")}
    <span style="--c:var(--ind)"><i></i><b class="num">${nf(done)}</b>${l.reviewedN}</span></div>`;
  $("#queueTitle").textContent = l.queue(nf(open.length));
  $("#list").innerHTML = S.cases.length ? sorted().map(card).join("") : `<div class="empty"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M10 17l.3-3M14 17l-.2-3M9.6 12.6 8 10.2M11 12V8.2M12.6 12V7.4M14 12.3l.8-3.6"/></svg><br>${l.empty}</div>`;
  if (location.hash.startsWith("#case-")) showCase();
}
function card(c) {
  const l = L(), done = !!c.reviewedAt, wait = minsBetween(c.arrivedAt, new Date());
  const late = !done && c.level === "red" && wait >= 10;
  const sum = c.summary ? `<div class="sum" dir="auto">📝 ${esc(c.summary)}${c.summaryDemo ? ` <small class="meta">(${l.demoTag})</small>` : ""}</div>`
    : c.sendState === "fail" ? `<div class="sum wait">${l.summaryFail} · <button class="btn small ghost" data-resend="${c.id}">${l.resend}</button></div>`
    : `<div class="sum wait">${l.summaryWait}</div>`;
  // الحالة الجديدة بس هي اللي بتظهر بحركة (مش كل ما القائمة تتحدث)
  const isNew = !seen.has(c.id); seen.add(c.id);
  return `<article class="case ${c.level} ${done ? "done" : ""} ${isNew ? "new" : ""}" style="--i:${seen.size % 8}">
    <div class="film"><img class="thumb" src="${c.img}" alt="">${c.boxes == null ? `<i class="scan"></i>` : ""}</div>
    <div>
      <h3>${l.caseN(nf(c.id))} <span class="tag">${done ? "✓ " + l.reviewedN : l[c.level]}</span></h3>
      <div class="meta">${done ? l.reviewedAt(hhmm(c.reviewedAt), l.minutes(minsBetween(c.arrivedAt, c.reviewedAt)))
        : `${l.arrived} <span class="num">${hhmm(c.arrivedAt)}</span>`}
        ${late ? ` · <span class="late">${l.late}</span>` : ""}</div>
      <div class="yolo meta">${c.boxes == null ? l.yWait : c.boxes.length ? l.yFound(c.boxes.length) : l.yNone}</div>
      ${sum}
    </div>
    <div class="end">
      <div class="big num" title="${l.suspicion}">${pct(c.p)}</div>
      <a class="btn small" href="#case-${c.id}">${l.open}</a>
      ${done ? "" : `<button class="btn small primary" data-review="${c.id}">${l.review}</button>`}
    </div></article>`;
}

// مربعات YOLO فوق الأشعة (الإحداثيات نسبة من الصورة الأصلية ← نحطها جوه مربع 384)
function boxSvg(c) {
  if (!c.boxes || !c.boxes.length) return "";
  const iw = c.ar >= 1 ? 384 : 384 * c.ar, ih = c.ar >= 1 ? 384 / c.ar : 384, ox = (384 - iw) / 2, oy = (384 - ih) / 2;
  return `<svg id="boxes" viewBox="0 0 384 384" preserveAspectRatio="none">${c.boxes.map(([a, b, x2, y2, s]) => {
    const X = ox + a * iw, Y = oy + b * ih, W = (x2 - a) * iw, H = (y2 - b) * ih;
    return `<rect x="${X.toFixed(1)}" y="${Y.toFixed(1)}" width="${W.toFixed(1)}" height="${H.toFixed(1)}" rx="3"/><text x="${X.toFixed(1)}" y="${Math.max(14, Y - 5).toFixed(1)}" direction="ltr">${Math.round(s * 100)}%</text>`;
  }).join("")}</svg>`;
}
const opts = (o, sel) => Object.entries(o).map(([k, t]) => `<option value="${k}" ${k === sel ? "selected" : ""}>${t}</option>`).join("");

// "العين الثانية": لو الطبيب قال "لا يوجد كسر" والنموذج شايف اشتباه قوي ← نسأله يتأكد
async function decide(c, k) {
  if (k === "none" && c.level === "red" && !(await ask(L().secondEyeAsk, L().sure, L().keep))) return;
  c.decision = k; c.decidedAt = isoLocal(); c.notes = $("#cNotes").value;
  if (!c.reviewedAt) c.reviewedAt = c.decidedAt;           // القرار = مراجعة
  save(); showCase(); toast(L().decSaved);
  sendEvent({ event: "doctor_decision", case_id: c.id, decision: k, notes: c.notes || null, decided_at: c.decidedAt,
    model_level: c.level, model_result: c.result, agrees_with_model: (k === "confirm") === (c.result === "fracture") });
}

// رسم الخريطة الحرارية: 12×12 خانة بألوان jet، والمتصفح بيكبرها بنعومة لـ 384
function drawCam(cam, canvas) {
  const s = document.createElement("canvas"); s.width = s.height = 12;
  const g = s.getContext("2d"), d = g.createImageData(12, 12);
  const jet = v => [Math.min(1, Math.max(0, 1.5 - Math.abs(4*v - 3))), Math.min(1, Math.max(0, 1.5 - Math.abs(4*v - 2))), Math.min(1, Math.max(0, 1.5 - Math.abs(4*v - 1)))];
  cam.forEach((v, i) => { const [r, gg, b] = jet(v); d.data.set([r*255, gg*255, b*255, 255*Math.min(1, 0.25 + v)], i*4); });
  g.putImageData(d, 0, 0);
  const G = canvas.getContext("2d"); G.clearRect(0, 0, 384, 384);
  G.imageSmoothingEnabled = true; G.imageSmoothingQuality = "high"; G.drawImage(s, 0, 0, 384, 384);
}

$("#chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) ask2(b.textContent); });
$("#chatForm").addEventListener("submit", e => { e.preventDefault(); const q = $("#chatIn").value.trim(); if (q) { $("#chatIn").value = ""; ask2(q); } });
// مكان الشات: في صفحة القائمة على الشاشات الكبيرة بيبقى ثابت تحت "رفع الصور" (docked)
// وفي صفحة الحالة أو الموبايل بيبقى نافذة بتفتح من الزرار العائم — والمحادثة نفسها واحدة
const wide = matchMedia("(min-width: 901px)");
function placeChat() {
  const el = $("#chat"), dock = wide.matches && !location.hash.startsWith("#case-");
  if (dock) { if (el.parentElement !== $("#dock")) $("#dock").appendChild(el); el.classList.add("docked"); el.hidden = false; $("#fab").hidden = true; }
  else { if (el.parentElement !== document.body) document.body.appendChild(el); el.classList.remove("docked"); $("#fab").hidden = false; el.hidden = !chat.open; }
}
wide.addEventListener("change", placeChat);
const openChat = on => { chat.open = on; placeChat(); $("#fab").setAttribute("aria-expanded", on); if (on || $("#chat").classList.contains("docked")) { renderChat(); if (on) $("#chatIn").focus(); } };
$("#fab").onclick = () => openChat(!chat.open);
// زراير البانر: "ارفع صورة أشعة" بيفتح اختيار الملفات، و"اسأل المساعد" بيروح للشات
$("#heroUpload").onclick = () => fileInput.click();
$("#heroAsk").onclick = () => { if ($("#chat").classList.contains("docked")) { $("#chat").scrollIntoView({ behavior: "smooth", block: "center" }); $("#chatIn").focus({ preventScroll: true }); } else openChat(true); };
$("#chatX").onclick = () => openChat(false);

async function ask2(q) {
  if (chat.busy) return;
  chat.msgs.push({ role: "user", text: q.slice(0, 600) }); chat.busy = true; renderChat();
  let reply;
  if (!chatEndpoint()) {                              // وضع تجريبي
    await new Promise(r => setTimeout(r, 500));
    reply = demoAnswer(q);
  } else {
    try {
      const r = await fetch(chatEndpoint(), { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lang: S.lang, messages: chat.msgs.slice(-12), context: chatContext() }) });
      const j = await r.json();
      reply = r.ok && j.reply ? j.reply : L().chatErr;
    } catch (e) { console.warn(e); reply = L().chatErr; }
  }
  chat.msgs.push({ role: "bot", text: reply }); chat.busy = false; renderChat();
}

// ردود الوضع التجريبي: بتستخدم بيانات الحالة الحقيقية، بس من غير ذكاء اصطناعي
function demoAnswer(q) {
  const ar = S.lang === "ar", c = currentCase(), s = q.toLowerCase(), has = (...w) => w.some(x => s.includes(x));
  const lv = CFG ? CFG.levels : { red: 0.43, yellow: 0.05 }, P = v => `${Math.round(v * 100)}%`;
  const m = CFG ? CFG.test_metrics : { AUC: 0.969, Recall: 0.928, Precision: 0.95, Accuracy: 0.92 };
  const yoloTxt = x => x.boxes == null ? (ar ? "YOLO لسه يدور على مكان الكسر." : "YOLO is still looking.")
    : x.boxes.length ? (ar ? `YOLO حدد ${x.boxes.length} ${x.boxes.length === 1 ? "مكان" : "أماكن"} للكسر (أعلى ثقة ${P(x.boxes[0][4])}).` : `YOLO marked ${x.boxes.length} location(s) (top confidence ${P(x.boxes[0][4])}).`)
    : (ar ? "YOLO ما لقى مكان كسر واضح." : "YOLO found no clear fracture location.");
  if (has("مربع", "yolo", "box"))
    return ar ? "**المربع الأحمر** من نموذج YOLO، وهو اللي يحدد **مكان الكسر** على الصورة، والرقم فوقه ثقة النموذج.\n" + (c ? yoloTxt(c) + "\n" : "") + "تقدر تخفيه أو تظهره من خانة «مكان الكسر (YOLO)» تحت الصورة."
      : "The **red box** comes from the YOLO model and marks **where the fracture is**; the number is its confidence.\n" + (c ? yoloTxt(c) + "\n" : "") + "You can toggle it under the image.";
  if (has("حرار", "خريطة", "grad", "heat"))
    return ar ? "**الخريطة الحرارية (Grad-CAM)** توضح وين ركز النموذج وهو ياخذ قراره: الأحمر أكثر تأثير والأزرق أقل.\nهي **توضيحية** وما تحدد مكان الكسر بدقة، وعشان كذا أضفنا مربعات YOLO. تقدر تتحكم في وضوحها بالشريط تحت الصورة."
      : "The **heat map (Grad-CAM)** shows where the model looked: red = most influence, blue = least.\nIt's **illustrative**, not an exact location, which is why we added YOLO boxes. Use the slider to adjust it.";
  if (has("خطو", "الجاي", "next", "do now"))
    return !c ? (ar ? "ابدأ بالحالات **الحمراء** اللي فوق القائمة، بعدين الصفراء، بعدين الخضراء. افتح أي حالة عشان تشوف التفاصيل." : "Start with the **red** cases at the top, then yellow, then green. Open a case to see details.")
      : ar ? `${c.level === "red" ? "الحالة **عاجلة**: الأفضل يراجعها طبيب العظام الحين." : c.level === "yellow" ? "النموذج **غير متأكد**، فالحالة تحتاج نظرة الطبيب." : "الحالة **غالبًا سليمة**، مراجعة عادية."}\nبعد المراجعة اختر قرار الطبيب (تأكيد كسر / لا يوجد كسر / يحتاج أشعة إضافية)، واكتب ملاحظاتك، والقرار ينحفظ وينرسل.`
      : `${c.level === "red" ? "This case is **urgent**: an orthopaedic review now is best." : c.level === "yellow" ? "The model is **unsure**, so a doctor should look." : "Likely **normal**, routine review."}\nAfter reviewing, choose the doctor's decision and add notes; it is saved and sent.`;
  if (has("نتيج", "الحالة", "result", "this case", "explain"))
    return !c ? (ar ? "افتح أي حالة من القائمة (زر «فتح الحالة») وأنا أشرح لك نتيجتها بالتفصيل." : "Open any case from the worklist and I'll explain its result.")
      : ar ? `**حالة ${c.id}**: نسبة اشتباه الكسر **${Math.min(99, Math.round(c.p * 100))}%**، يعني ${L()[c.level]}.\n${yoloTxt(c)}\n${c.level === "red" ? "النسبة فوق حد الأحمر، فالنموذج واثق إن فيه كسر ونقلها لأول القائمة." : c.level === "yellow" ? "النسبة في المنطقة الوسط، فالنموذج يطلب رأي الطبيب." : "النسبة تحت حد الأخضر، فاحتمال الكسر ضعيف."}\nالقرار النهائي دايمًا للطبيب.`
      : `**Case ${c.id}**: fracture suspicion **${Math.min(99, Math.round(c.p * 100))}%** (${L()[c.level].toLowerCase()}).\n${yoloTxt(c)}\nThe final decision is always the doctor's.`;
  if (has("لون", "ألوان", "الوان", "أحمر", "أصفر", "أخضر", "colour", "color", "red", "yellow", "green"))
    return ar ? `• 🔴 **أحمر** (${P(lv.red)} أو أكثر): اشتباه قوي بكسر، أولوية عاجلة.\n• 🟡 **أصفر** (${P(lv.yellow)} إلى ${P(lv.red)}): النموذج غير متأكد، يحتاج نظرة الطبيب.\n• 🟢 **أخضر** (أقل من ${P(lv.yellow)}): غالبًا سليم.\nالحدود هذي اختيرت من بيانات التحقق عشان ما يفوت كسر.`
      : `• 🔴 **Red** (${P(lv.red)}+): strong suspicion, urgent.\n• 🟡 **Yellow** (${P(lv.yellow)}–${P(lv.red)}): unsure, needs a doctor.\n• 🟢 **Green** (below ${P(lv.yellow)}): likely normal.\nThresholds were chosen on validation data to avoid missing fractures.`;
  if (has("دق", "موثوق", "auc", "recall", "accura"))
    return ar ? `على بيانات اختبار لمرضى ما شافهم النموذج (2,960 صورة):\n• **AUC** ${m.AUC.toFixed(3)}\n• اكتشف **${P(m.Recall)}** من الكسور\n• لما يقول كسر يكون صح **${P(m.Precision)}** من المرات\nوهو نموذج تعليمي، مو للاستخدام السريري.`
      : `On test data from unseen patients (2,960 images):\n• **AUC** ${m.AUC.toFixed(3)}\n• Caught **${P(m.Recall)}** of fractures\n• Correct **${P(m.Precision)}** of the time when it says fracture\nEducational model, not for clinical use.`;
  if (has("استخدم", "أستخدم", "ارفع", "رفع", "use", "upload", "how"))
    return ar ? "1. اسحب صور الأشعة للمربع أو اضغط عليه (تقدر ترفع أكثر من صورة).\n2. النموذج يرتبها تلقائيًا: الأحمر فوق.\n3. افتح الحالة تشوف الخريطة الحرارية ومكان الكسر.\n4. اختر قرار الطبيب واضغط «تمت المراجعة».\nالصور تتحلل داخل المتصفح وما تطلع من الجهاز."
      : "1. Drop X-rays into the box (several at once is fine).\n2. The model sorts them: red on top.\n3. Open a case to see the heat map and fracture location.\n4. Choose the doctor's decision and mark reviewed.\nImages are analysed in the browser and never leave the device.";
  return ar ? "سؤال حلو! في الوضع التجريبي أقدر أجاوب عن: نتيجة الحالة، معنى الألوان، الخريطة الحرارية، مربعات YOLO، دقة النموذج، وطريقة الاستخدام. بعد ربط Gemini أقدر أجاوب على أي سؤال."
    : "Good question! In demo mode I can explain: a case's result, the colours, the heat map, YOLO boxes, model accuracy and how to use the page. Once Gemini is connected I can answer anything.";
}

applyLang(); placeChat(); renderChat();
loadModel().then(loadYolo);   // الأول نموذج التصنيف، وبعده YOLO (أكبر في الحجم)
}
</script>
</body>
</html>
